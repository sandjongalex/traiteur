name: Temporary brand rename

on:
  push:
    paths:
      - ".github/workflows/rename-brand.yml"

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace visible brand name
        run: |
          python - <<'PY'
          from pathlib import Path

          text_exts = {
              '.py', '.html', '.md', '.txt', '.css', '.js', '.svg', '.yml', '.yaml',
              '.toml', '.ini', '.cfg', '.example'
          }
          skip_parts = {'.git', '.venv', 'venv', '__pycache__'}
          replacements = [
              ('WATO EVENTS', 'DNP DECO'),
              ('Wato Events', 'DNP DECO'),
              ('WATO Events', 'DNP DECO'),
              ('<strong>WATO</strong><small>EVENTS</small>', '<strong>DNP</strong><small>DECO</small>'),
              ('<span class="brand-mark" aria-hidden="true">WE</span>', '<span class="brand-mark" aria-hidden="true">DD</span>'),
          ]

          changed = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or any(part in skip_parts for part in path.parts):
                  continue
              if path.name == '.env.example' or path.suffix.lower() in text_exts:
                  try:
                      original = path.read_text(encoding='utf-8')
                  except UnicodeDecodeError:
                      continue
                  updated = original
                  for old, new in replacements:
                      updated = updated.replace(old, new)
                  if updated != original:
                      path.write_text(updated, encoding='utf-8')
                      changed.append(str(path))

          print('Changed files:')
          for path in changed:
              print(' -', path)

          print('\nRemaining WATO/Wato occurrences (technical names may remain intentionally):')
          for path in Path('.').rglob('*'):
              if not path.is_file() or any(part in skip_parts for part in path.parts):
                  continue
              if path.name == '.env.example' or path.suffix.lower() in text_exts:
                  try:
                      for no, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                          if 'WATO' in line or 'Wato' in line:
                              print(f'{path}:{no}: {line.strip()}')
                  except UnicodeDecodeError:
                      pass
          PY

      - name: Commit rename
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "refactor(brand): rename WATO EVENTS to DNP DECO"
            git push origin HEAD:main
          fi
